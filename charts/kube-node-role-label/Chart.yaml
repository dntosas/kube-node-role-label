apiVersion: v2
name: kube-node-role-label
description: Derives node-role.kubernetes.io/* labels from existing node labels so `kubectl get nodes` shows meaningful roles.
type: application
version: 1.1.0
appVersion: "1.1.0"
kubeVersion: ">=1.25.0-0"
home: https://github.com/dntosas/kube-node-role-label
sources:
  - https://github.com/dntosas/kube-node-role-label
maintainers:
  - name: dntosas
    url: https://github.com/dntosas
keywords:
  - kubernetes
  - nodes
  - labels
  - node-role
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/changes: |
    - kind: changed
      description: Structured JSON logging; already-labelled nodes no longer emit a log line every interval.
    - kind: added
      description: logLevel, logFormat, extraArgs, priorityClassName, revisionHistoryLimit values.
    - kind: changed
      description: Hardened default securityContext and default resource requests/limits.
