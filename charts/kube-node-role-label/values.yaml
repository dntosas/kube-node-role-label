# Default values for kube-node-role-label.

# -- Number of replicas. The controller is idempotent, but one replica is enough.
replicaCount: 1

# -- Number of old ReplicaSets to retain.
revisionHistoryLimit: 3

image:
  # -- Container image repository.
  repository: ghcr.io/dntosas/kube-node-role-label
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Image tag. Defaults to the chart appVersion.
  tag: ""

# -- Secrets for pulling the image from a private registry.
imagePullSecrets: []

# -- Override the chart name.
nameOverride: ""
# -- Override the fully qualified release name.
fullnameOverride: ""

label_watch:
  # -- How often to reconcile. Node labels rarely change after a node joins, so
  # 5m-15m is plenty. Accepts Go durations (30s, 5m, 1h).
  interval: 5m
  # -- Comma-separated node label keys to watch. For every node carrying
  # `key=value`, `node-role.kubernetes.io/<value>=true` is added.
  labels: node-type

# -- Minimum log level: debug, info, warn or error. At `info` a steady-state
# cluster produces no output; every added role is logged once.
logLevel: info

# -- Log format: json or text.
logFormat: json

# -- Additional command-line arguments appended to the container args.
extraArgs: []

# -- Annotations added to the pod.
podAnnotations: {}

# -- Labels added to the pod (e.g. a `service` label for log routing).
podLabels: {}

# -- Pod-level security context.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context.
securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Resource requests and limits. The controller is tiny; these are generous.
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

rbac:
  # -- Create a ClusterRole/ClusterRoleBinding allowing list+patch on nodes.
  create: true

serviceAccount:
  # -- Create a ServiceAccount for the controller.
  create: true
  # -- Annotations added to the ServiceAccount (e.g. for IRSA/Workload Identity).
  annotations: {}
  # -- ServiceAccount name. Generated from the release name when empty.
  name: ""
  # -- Mount the ServiceAccount token. Required for in-cluster API access.
  automountServiceAccountToken: true

# -- Priority class for the pod, e.g. `system-cluster-critical`.
priorityClassName: ""

# -- Node selector for pod scheduling.
nodeSelector: {}

# -- Tolerations for pod scheduling.
tolerations: []

# -- Affinity rules for pod scheduling.
affinity: {}

# -- Topology spread constraints for pod scheduling.
topologySpreadConstraints: []
