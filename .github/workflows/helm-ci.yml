name: Helm CI

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/helm-ci.yml"
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/helm-ci.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint
        run: helm lint --strict charts/kube-node-role-label

      - name: Template (defaults)
        run: helm template kube-node-role-label charts/kube-node-role-label

      - name: Template (all optional values)
        run: |
          helm template kube-node-role-label charts/kube-node-role-label \
            --set logLevel=debug \
            --set logFormat=text \
            --set extraArgs[0]=-kubeconfig \
            --set extraArgs[1]=/dev/null \
            --set rbac.create=false \
            --set serviceAccount.create=false \
            --set priorityClassName=system-cluster-critical

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check chart README is up to date
        run: |
          make helm-docs
          git diff --exit-code -- charts/ || {
            echo "::error::charts/*/README.md is stale, run 'make helm-docs' and commit the result"
            exit 1
          }
