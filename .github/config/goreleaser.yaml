version: 2

project_name: kube-node-role-label
dist: dist

before:
  hooks:
    - go mod tidy

builds:
  - id: kube-node-role-label
    main: .
    binary: "{{ .ProjectName }}"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/dntosas/{{ .ProjectName }}/cmd.Version={{ .Version }}
      - -X github.com/dntosas/{{ .ProjectName }}/cmd.CommitHash={{ .FullCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"

# Multi-arch image built with `docker buildx` in a single step (pushed at publish time).
dockers_v2:
  - id: image
    ids: [kube-node-role-label]
    dockerfile: Dockerfile
    images:
      - ghcr.io/dntosas/{{ .ProjectName }}
    tags:
      - "{{ .Version }}"
      - "v{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.licenses: MIT
    annotations:
      org.opencontainers.image.description: Derive node-role.kubernetes.io/* labels from existing node labels
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore\\(deps\\):"
      - "^Merge pull request"

release:
  github:
    owner: dntosas
    name: kube-node-role-label
  footer: |
    ## Container image

    ```
    ghcr.io/dntosas/kube-node-role-label:{{ .Version }}
    ```
